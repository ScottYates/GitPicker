name: build

# The gate: vet, test and build on every push, plus the parity check that
# holds the Go picker to the same output as the Python one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: vet, test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -ldflags "-s -w" -o git-picker.exe .

      - name: upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: git-picker-windows
          path: git-picker.exe

  parity:
    name: parity against the python picker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the python dependencies
        run: pip install InquirerPy

      - name: build
        run: go build -ldflags "-s -w" -o git-picker.exe .

      - name: compare against git_picker.py
        run: python parity_check.py
