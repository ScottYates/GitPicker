name: release

# Pushing a tag such as v1.1 builds the binary and publishes the release
# with the binary attached. No third party action is involved: the release
# is made with the GitHub CLI that ships on the runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: build
        run: go build -ldflags "-s -w" -o git-picker.exe .

      - name: create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "git-picker $env:GITHUB_REF_NAME" `
            --generate-notes `
            git-picker.exe
